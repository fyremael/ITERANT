name: PHASE-RLVR campaign

on:
  push:
    branches: [main]
    paths:
      - "campaigns/phase-rlvr/**"
      - "Makefile"
      - ".github/workflows/phase-rlvr.yml"
  pull_request:
    paths:
      - "campaigns/phase-rlvr/**"
      - "Makefile"
      - ".github/workflows/phase-rlvr.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controller-contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run PHASE-RLVR contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}/campaigns/phase-rlvr/src
        run: python -m unittest discover -s campaigns/phase-rlvr/tests -v
