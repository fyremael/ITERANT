[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gcl-one-layer-campaign"
version = "0.1.0"
description = "GCL campaign harness for the One Layer Deeper competition"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
old-campaign = "old_campaign.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
